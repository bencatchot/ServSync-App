name: Pull Request Quality

on:
  pull_request:

concurrency:
  group: pull-request-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, architecture, types, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify tutorial impact declaration
        env:
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: node scripts/validation/check-tutorial-impact-declaration.mjs
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run check:app-size
      - run: npm run test:architecture
      - run: npm run backend:parity:test
      - run: npm run runtime:parity:test
      - run: npm run test:demo-recorder
      - run: npm run typecheck
      - run: npm run typecheck:practice
      - name: Verify Service Plan visit logic
        run: node --import tsx --test tests/serviceAgreements/*.test.ts
      - name: Verify isolated Service Plan visit persistence
        run: PATH="$(pg_config --bindir):$PATH" bash scripts/validation/validate-service-plan-visits.sh
      - name: Verify isolated Practice database foundation
        run: PG16_BIN="$(pg_config --bindir)" npm run test:practice
      - run: npm run build
